<div class="bg-gray-800 p-6 md:p-8 rounded-2xl shadow-2xl">
    <label for="review-text" class="mb-2 text-sm font-medium text-gray-300">
        Escribe tu reseña aquí:
    </label>
    <textarea 
        id="review-text"
        rows="6"
        class="w-full bg-gray-700 p-4 rounded-lg text-gray-100 placeholder-gray-500 border-2 border-transparent focus:border-blue-500 focus:bg-gray-600 focus:outline-none transition-all"
        placeholder="Ej: 'Este producto es increíble...' o 'This product is amazing...'"
        [value]="reviewText()"
        (input)="onTextChange($event)"
    ></textarea>
    
    <button
        (click)="analyzeSentiment()"
        [disabled]="isLoading()"
        class="mt-5 w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white text-lg font-semibold py-3 px-6 rounded-lg shadow-md transition-all duration-300 ease-in-out
            disabled:opacity-50 disabled:cursor-not-allowed"
    >
        @if (isLoading()) {
        <span class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Analizando...
        </span>
        } @else {
        <span>Analizar Sentimiento</span>
        }
    </button>
    </div>

    <div class="mt-10">
    
    @if (error(); as errorMsg) {
        <div class="bg-red-800 border border-red-600 text-red-200 px-6 py-4 rounded-lg shadow-lg">
        <h3 class="font-bold text-lg mb-1">Error de Conexión</h3>
        <p>{{ errorMsg }}</p>
        </div>
    }

    @if (result(); as res) {
        <div 
        class="p-6 md:p-8 rounded-2xl shadow-2xl transition-all duration-500"
        [class.bg-gradient-to-br]="res.label === 'Positivo'"
        [class.from-green-600]="res.label === 'Positivo'"
        [class.to-green-800]="res.label === 'Positivo'"
        [class.bg-gradient-to-br]="res.label === 'Negativo'"
        [class.from-red-600]="res.label === 'Negativo'"
        [class.to-red-800]="res.label === 'Negativo'"
        >
        <h3 class="text-sm font-medium uppercase tracking-wider text-white opacity-80 mb-3">Resultado del Análisis:</h3>
        
        <div class="flex flex-col md:flex-row items-baseline md:items-center justify-between">
            <span class="text-5xl md:text-6xl font-extrabold">
            {{ res.label }}
            </span>
            <span class="text-3xl font-medium text-white opacity-90 mt-2 md:mt-0">
            {{ (res.score * 100) | number:'1.0-1' }}%
            <span class="text-lg opacity-70">Confianza</span>
            </span>
        </div>
        
        @if (res.translated_text) {
            <div class="mt-4 pt-4 border-t border-white/20">
            <p class="text-xs text-white/70 italic">
                "{{ res.translated_text }}"
                <span class="block text-white/50 not-italic">(Texto traducido para análisis)</span>
            </p>
            </div>
        }
        </div>
    }
</div>
